<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: html(~{::#content})}">
<body>
<div id="content" class="row justify-content-center">
    <div class="col-md-5">
        <h1>Criar conta de solicitante</h1>
        <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
        <form method="post" th:action="@{/register}">
            <div class="mb-3">
                <label for="name" class="form-label">Nome</label>
                <input id="name" name="name" class="form-control" required maxlength="120">
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">E-mail</label>
                <input id="email" name="email" type="email" class="form-control" required maxlength="160">
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Senha (mínimo 8 caracteres)</label>
                <input id="password" name="password" type="password" class="form-control" required minlength="8">
            </div>
            <button type="submit" class="btn btn-primary">Criar conta</button>
        </form>
    </div>
</div>
</body>
</html>
