<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: html(~{::#content})}">
<body>
<div id="content">
    <h1>Minhas reservas</h1>
    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
    <h2 class="h4 mt-4" th:text="${reservationId == null ? 'Solicitar reserva' : 'Alterar reserva'}"></h2>
    <form method="post" th:object="${reservationForm}"
          th:action="${reservationId == null ? '/reservations' : '/reservations/' + reservationId}">
        <div class="mb-3">
            <label class="form-label" for="resourceIds">Salas e materiais</label>
            <select class="form-select" id="resourceIds" th:field="*{resourceIds}" multiple required>
                <option th:each="resource : ${resources}" th:value="${resource.id}"
                        th:text="${resource.name + ' (' + resource.type + (resource.restricted ? ', restrito' : '') + ')'}"></option>
            </select>
            <div class="form-text">Use Ctrl/Cmd para selecionar mais de um recurso.</div>
        </div>
        <div class="mb-3">
            <label class="form-label" for="teacherId">Professor (opcional)</label>
            <select class="form-select" id="teacherId" th:field="*{teacherId}">
                <option value="">Sem professor</option>
                <option th:each="teacher : ${teachers}" th:value="${teacher.id}" th:text="${teacher.name}"></option>
            </select>
        </div>
        <div class="row">
            <div class="col-md-6 mb-3"><label class="form-label" for="startAt">Início</label><input class="form-control" id="startAt" th:field="*{startAt}" type="datetime-local" required></div>
            <div class="col-md-6 mb-3"><label class="form-label" for="endAt">Fim</label><input class="form-control" id="endAt" th:field="*{endAt}" type="datetime-local" required></div>
        </div>
        <button class="btn btn-primary" type="submit"
                th:text="${reservationId == null ? 'Solicitar' : 'Salvar alterações'}"></button>
        <a th:if="${reservationId != null}" class="btn btn-secondary" href="/reservations">Cancelar edição</a>
    </form>
    <h2 class="h4 mt-5">Histórico</h2>
    <div class="table-responsive"><table class="table table-striped">
        <thead><tr><th>Recursos</th><th>Professor</th><th>Início</th><th>Fim</th><th>Status</th><th>Ações</th></tr></thead>
        <tbody>
        <tr th:each="reservation : ${reservations}">
            <td th:text="${#strings.listJoin(reservation.resourceIds, ', ')}"></td>
            <td th:text="${reservation.teacherId != null ? reservation.teacherId : '-'}"></td>
            <td th:text="${reservation.startAt}"></td><td th:text="${reservation.endAt}"></td><td th:text="${reservation.status}"></td>
            <td>
                <a th:if="${reservation.status.name() == 'APPROVED' or reservation.status.name() == 'PENDING_APPROVAL'}"
                   class="btn btn-sm btn-outline-primary"
                   th:href="@{/reservations/{id}/edit(id=${reservation.id})}">Alterar</a>
                <form th:if="${reservation.status.name() == 'APPROVED' or reservation.status.name() == 'PENDING_APPROVAL'}"
                      method="post" th:action="@{/reservations/{id}/cancel(id=${reservation.id})}">
                    <button class="btn btn-sm btn-outline-danger" type="submit">Cancelar</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(reservations)}"><td colspan="6">Você ainda não possui reservas.</td></tr>
        </tbody>
    </table></div>
</div>
</body>
</html>
