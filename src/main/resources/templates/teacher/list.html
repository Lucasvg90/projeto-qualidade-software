<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout :: html(~{::#content})}">
<head>
    <meta charset="UTF-8">
    <title>Teachers - Educational Quality Project</title>
</head>
<body>
    <div id="content">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2>Professores</h2>
            <a href="/teachers/new" class="btn btn-primary">Cadastrar professor</a>
        </div>

        <form class="row g-2 mb-3" method="get" action="/teachers">
            <div class="col-md-4">
                <label for="competence" class="form-label">Pesquisar por competência</label>
                <input id="competence" name="competence" class="form-control" th:value="${competence}">
            </div>
            <div class="col-md-3">
                <label for="availableFrom" class="form-label">Disponível a partir de</label>
                <input id="availableFrom" name="availableFrom" type="datetime-local" class="form-control">
            </div>
            <div class="col-md-3">
                <label for="availableUntil" class="form-label">Até</label>
                <input id="availableUntil" name="availableUntil" type="datetime-local" class="form-control">
            </div>
            <div class="col-md-2 align-self-end"><button class="btn btn-outline-primary" type="submit">Pesquisar</button></div>
        </form>
        
        <div class="table-responsive">
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>E-mail</th>
                    <th>Departamento</th>
                    <th>Competências</th>
                    <th sec:authorize="hasRole('ADMIN')">Ações</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="teacher : ${teachers}">
                    <td th:text="${teacher.name}"></td>
                    <td th:text="${teacher.email}"></td>
                    <td th:text="${teacher.department}"></td>
                    <td th:text="${#strings.listJoin(teacher.competencies, ', ')}"></td>
                    <td sec:authorize="hasRole('ADMIN')">
                        <a href="#" th:href="@{/teachers/{id}/edit(id=${teacher.id})}" class="btn btn-sm btn-outline-primary">Editar</a>
                        <a href="#" th:href="@{/teachers/{id}/delete(id=${teacher.id})}" 
                           class="btn btn-sm btn-outline-danger" 
                           onclick="return confirm('Deseja excluir este professor?')">Excluir</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(teachers)}">
                    <td colspan="5">Nenhum professor encontrado.</td>
                </tr>
            </tbody>
        </table>
        </div>
    </div>
</body>
</html>
