<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout :: html(~{::#content})}">
<body>
<div id="content">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1>Recursos</h1>
        <a sec:authorize="hasRole('ADMIN')" class="btn btn-primary" href="/resources/new">Cadastrar recurso</a>
    </div>
    <form class="row g-2 mb-4" method="get" action="/resources">
        <div class="col-md-2">
            <label class="form-label" for="type">Tipo</label>
            <select class="form-select" id="type" name="type">
                <option value="">Todos</option>
                <option th:each="option : ${types}" th:value="${option}" th:text="${option}"
                        th:selected="${filters.type == option}"></option>
            </select>
        </div>
        <div class="col-md-2">
            <label class="form-label" for="capacity">Capacidade mínima</label>
            <input class="form-control" id="capacity" name="capacity" type="number" min="1" th:value="${filters.capacity}">
        </div>
        <div class="col-md-2">
            <label class="form-label" for="location">Localização</label>
            <input class="form-control" id="location" name="location" th:value="${filters.location}">
        </div>
        <div class="col-md-2">
            <label class="form-label" for="competence">Competência</label>
            <input class="form-control" id="competence" name="competence" th:value="${filters.competence}">
        </div>
        <div class="col-md-2">
            <label class="form-label" for="availableFrom">Disponível a partir de</label>
            <input class="form-control" id="availableFrom" name="availableFrom" type="datetime-local">
        </div>
        <div class="col-md-2">
            <label class="form-label" for="availableUntil">Até</label>
            <input class="form-control" id="availableUntil" name="availableUntil" type="datetime-local">
        </div>
        <div class="col-12"><button class="btn btn-outline-primary" type="submit">Pesquisar</button></div>
    </form>
    <div class="table-responsive">
        <table class="table table-striped">
            <thead><tr><th>Nome</th><th>Tipo</th><th>Local</th><th>Capacidade</th><th>Competências</th><th>Restrito</th><th>Estado</th><th sec:authorize="hasRole('ADMIN')">Ações</th></tr></thead>
            <tbody>
            <tr th:each="resource : ${resources}">
                <td th:text="${resource.name}"></td>
                <td th:text="${resource.type}"></td>
                <td th:text="${resource.location}"></td>
                <td th:text="${resource.capacity != null ? resource.capacity : '-'}"></td>
                <td th:text="${#strings.listJoin(resource.competencies, ', ')}"></td>
                <td th:text="${resource.restricted ? 'Sim (exige aprovação)' : 'Não'}"></td>
                <td th:text="${resource.underMaintenance ? 'Em manutenção' : 'Disponível'}"></td>
                <td sec:authorize="hasRole('ADMIN')">
                    <a class="btn btn-sm btn-outline-primary" th:href="@{/resources/{id}/edit(id=${resource.id})}">Editar</a>
                    <form class="d-inline" method="post" th:action="@{/resources/{id}/delete(id=${resource.id})}">
                        <button class="btn btn-sm btn-outline-danger" type="submit">Excluir</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(resources)}"><td colspan="8">Nenhum recurso encontrado.</td></tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
