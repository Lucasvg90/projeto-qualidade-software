<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: html(~{::#content})}">
<body>
<div id="content">
    <h1 th:text="${resource.id == null ? 'Novo recurso' : 'Editar recurso'}"></h1>
    <form th:action="${resource.id == null ? '/resources' : '/resources/' + resource.id}" th:object="${resource}" method="post">
        <div class="mb-3"><label class="form-label" for="name">Nome</label><input id="name" class="form-control" th:field="*{name}" required></div>
        <div class="mb-3">
            <label class="form-label" for="type">Tipo</label>
            <select id="type" class="form-select" th:field="*{type}" required>
                <option value="">Selecione</option><option th:each="option : ${types}" th:value="${option}" th:text="${option}"></option>
            </select>
        </div>
        <div class="mb-3"><label class="form-label" for="location">Localização</label><input id="location" class="form-control" th:field="*{location}" required></div>
        <div class="mb-3"><label class="form-label" for="capacity">Capacidade (salas)</label><input id="capacity" class="form-control" type="number" min="1" th:field="*{capacity}"></div>
        <div class="mb-3"><label class="form-label" for="description">Descrição</label><textarea id="description" class="form-control" th:field="*{description}"></textarea></div>
        <div class="mb-3"><label class="form-label" for="competencies">Competências (separadas por vírgula)</label><input id="competencies" class="form-control" name="competencies" th:value="${#strings.listJoin(resource.competencies, ', ')}"></div>
        <div class="form-check mb-3"><input id="restricted" class="form-check-input" type="checkbox" th:field="*{restricted}"><label class="form-check-label" for="restricted">Recurso restrito (exige aprovação)</label></div>
        <div class="form-check mb-3"><input id="underMaintenance" class="form-check-input" type="checkbox" th:field="*{underMaintenance}"><label class="form-check-label" for="underMaintenance">Em manutenção (bloqueia novas reservas)</label></div>
        <button class="btn btn-primary" type="submit">Salvar</button><a class="btn btn-secondary" href="/resources">Cancelar</a>
    </form>
</div>
</body>
</html>
