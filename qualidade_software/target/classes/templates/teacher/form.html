<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: html(~{::#content})}">
<head>
    <meta charset="UTF-8">
    <title th:text="${teacher.id != null ? 'Editar professor' : 'Novo professor'}">Professor</title>
</head>
<body>
    <div id="content">
        <div class="mb-4">
            <a href="/teachers" class="link-secondary text-decoration-none">← Voltar para professores</a>
            <h1 class="h2 mt-3" th:text="${teacher.id != null ? 'Editar professor' : 'Cadastrar professor'}">Professor</h1>
            <p class="text-body-secondary mb-0">Preencha os dados abaixo para salvar o registro.</p>
        </div>

        <div class="card shadow-sm">
            <div class="card-body p-4">
                <form th:action="${teacher.id != null ? '/teachers/' + teacher.id : '/teachers'}"
                      th:object="${teacher}"
                      method="post">
                    <div class="mb-3">
                        <label for="name" class="form-label">Nome completo</label>
                        <input type="text" class="form-control" id="name" th:field="*{name}" autocomplete="name" required>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">E-mail</label>
                        <input type="email" class="form-control" id="email" th:field="*{email}" autocomplete="email" required>
                    </div>

                    <div class="mb-4">
                        <label for="department" class="form-label">Departamento</label>
                        <input type="text" class="form-control" id="department" th:field="*{department}" required>
                    </div>

                    <button type="submit" class="btn btn-primary"
                            th:text="${teacher.id != null ? 'Salvar alterações' : 'Cadastrar professor'}">Salvar</button>
                    <a href="/teachers" class="btn btn-outline-secondary ms-2">Cancelar</a>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
