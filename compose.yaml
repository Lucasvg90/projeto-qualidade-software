services:
  mongodb:
    image: mongo:7.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval 'try {
          if (rs.status().members[0].stateStr === "PRIMARY") quit(0);
          } catch (e) {
          rs.initiate({_id: "rs0", members: [{_id: 0, host: "localhost:27017"}]});
          } quit(1);'
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

volumes:
  mongodb_data:
